<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Contact VINATECH Limited - VinATech</title>
  <link rel="stylesheet" href="css/pages/contact.css">
</head>
<body>
<div class="contact-root"><header class="contact-header"><div class="contact-header-inner"><div class="brand">VinATech Limited</div><button class="hamburger" id="contactMenuToggle" type="button" aria-label="Toggle navigation" aria-expanded="false" aria-controls="contactNav"><span class="bar"></span></button><nav class="contact-nav" id="contactNav"><a href="index.html">HOME</a><a href="news.html">NEWS</a><a href="contact.html" class="current">CONTACT</a><a href="privacy.html">PRIVACY POLICY</a></nav></div></header><main class="contact-main"><section class="contact-hero"><p class="eyebrow">Get In Touch</p><h1>Contact VINATECH Limited</h1><p>Tell us about your project needs and our team will respond promptly.</p></section><section class="contact-card"><form id="contactForm" action="https://formspree.io/f/mrevdeyn" method="POST" data-subject-prefix="Website Contact Request"><input type="hidden" name="_subject" value="Website Contact Request - Website"><input type="text" name="_gotcha" style="display:none" tabindex="-1" autocomplete="off"><div class="field-row"><label>First Name<input type="text" name="First Name" placeholder="Your first name" required></label></div><div class="field-row"><label>Last Name<input type="text" name="Last Name" placeholder="Your last name" required></label></div><div class="field-row"><label>Business Email<input type="email" name="Business Email" placeholder="name@company.com" required></label></div><div class="field-row"><label>Company<input type="text" name="Company" placeholder="Company name" required></label></div><div class="field-row full"><label>Message<textarea name="Message" placeholder="How can we help?" required></textarea></label></div><label class="consent"><input type="checkbox" name="I agree to the Privacy Policy" required><span>I agree to the Privacy Policy <a href="privacy.html">Privacy Policy</a> of VINATECH Limited.</span></label><button type="submit">Submit</button></form><p class="contact-note">Submitting sends your message securely via Formspree.</p></section></main><footer class="contact-footer">&copy; VINATECH 2026. All rights reserved.</footer></div>
<script>(function(){var p=new URLSearchParams(window.location.search);var preview=p.get('configuratorPreview')==='1';var device=(p.get('pdevice')||'').toLowerCase();if(preview){if(device==='mobile'){document.body.classList.add('preview-force-mobile');document.body.classList.remove('preview-force-desktop');}else if(device==='desktop'){document.body.classList.add('preview-force-desktop');document.body.classList.remove('preview-force-mobile');}}var b=document.getElementById('contactMenuToggle');var r=document.querySelector('.contact-root');if(b&&r){b.addEventListener('click',function(){var o=r.classList.toggle('nav-open');b.setAttribute('aria-expanded',o?'true':'false');});}var f=document.getElementById('contactForm');if(!f){return;}var titleNode=document.querySelector('.contact-hero h1');var introNode=document.querySelector('.contact-hero p');var submitButton=f.querySelector('button[type="submit"]');var noteNode=document.querySelector('.contact-note');var endpoint=(f.getAttribute('action')||'').trim();var subjectPrefix=(f.getAttribute('data-subject-prefix')||'Website Contact Request').trim();if(preview){endpoint=(p.get('cform')||endpoint).trim();subjectPrefix=(p.get('csubject')||subjectPrefix).trim();if(p.get('ctitle')&&titleNode){titleNode.textContent=p.get('ctitle');}if(p.get('cintro')&&introNode){introNode.textContent=p.get('cintro');}if(p.get('csubmit')&&submitButton){submitButton.textContent=p.get('csubmit');}}if(endpoint){f.setAttribute('action',endpoint);}f.setAttribute('data-subject-prefix',subjectPrefix);var hiddenSubject=f.querySelector('input[name="_subject"]');if(hiddenSubject){hiddenSubject.value=subjectPrefix+' - Website';}if(noteNode){noteNode.textContent=endpoint?'Submitting sends your message securely via Formspree.':'Add a Formspree endpoint to enable submit.';}if(!endpoint){f.addEventListener('submit',function(e){e.preventDefault();});}})();</script>
</body>
</html>
