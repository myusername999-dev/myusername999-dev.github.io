  <style>
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:#011301;color:#dbe6e6;padding-bottom:44px}
.home-root{min-height:100vh;position:relative;overflow:hidden;isolation:isolate;background:var(--preview-bg);color:var(--preview-text)}
.home-bg{position:absolute;inset:0;background-size:cover;background-repeat:no-repeat;opacity:var(--preview-bg-opacity,.68);z-index:-2}
.home-overlay{position:absolute;inset:0;z-index:-1}
.home-header{max-width:1240px;margin:0 auto;padding:24px;display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}
.brand-logos{position:relative;min-width:280px;min-height:96px;flex:1 1 280px}
.logo-slot{position:absolute;left:0;top:0;display:flex;align-items:center;justify-content:center;transform-origin:center;touch-action:none}
.logo-slot img{width:100%;height:100%;object-fit:contain;display:block}
.logo-fallback{font-size:.78rem;font-weight:700;padding:8px 10px;border-radius:10px;border:1px dashed color-mix(in srgb,var(--preview-text) 28%,#fff 72%);background:color-mix(in srgb,var(--preview-surface) 86%,#fff 14%);text-align:center}
.home-nav{display:flex;flex-wrap:wrap;gap:8px}
.home-nav a{text-decoration:none;color:inherit;border:1px solid color-mix(in srgb,var(--preview-text) 18%,#fff 82%);padding:8px 12px;border-radius:999px;background:color-mix(in srgb,var(--preview-surface) 72%,#fff 28%);font-size:var(--preview-button-size)}
.home-tab-selector{margin-top:18px;display:flex;flex-wrap:wrap;gap:8px}
.home-tab-selector a{text-decoration:none;color:inherit;border:1px solid color-mix(in srgb,var(--preview-text) 18%,#fff 82%);padding:8px 12px;border-radius:999px;background:color-mix(in srgb,var(--preview-surface) 72%,#fff 28%);font-size:var(--preview-button-size)}
.hero-wrap{max-width:1240px;margin:34px auto 0;padding:0 24px 36px}
.hero-title-slot,.hero-subtitle-slot{max-width:760px;touch-action:none;cursor:grab}
.hero-title-slot h1{margin:0;line-height:.98;letter-spacing:-.03em;font-size:var(--preview-heading-size)}
.hero-subtitle-slot{margin-top:20px}
.hero-subtitle-slot p{margin:0;line-height:1.55;font-size:var(--preview-body-size);max-width:60ch}
.cta-slot{display:flex;flex-wrap:wrap;gap:10px;margin-top:28px}
.cta-slot a{display:inline-flex;align-items:center;gap:8px;text-decoration:none;font-weight:700;padding:12px 18px;border-radius:999px;font-size:var(--preview-button-size)}
.generated-sections{max-width:1240px;margin:0 auto;padding:8px 24px 36px;display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.generated-card{border-radius:14px;padding:18px;border:1px solid color-mix(in srgb,var(--preview-text) 22%,#fff 78%);background:color-mix(in srgb,var(--preview-surface) 76%,#fff 24%)}
.generated-card h3{margin:0;font-size:1.1rem}
.generated-card p{margin:8px 0 0;line-height:1.5;color:var(--preview-muted)}
.site-footer-fixed{position:fixed;left:0;right:0;bottom:0;z-index:999;text-align:left;padding:12px 16px;font-size:.84rem;color:#ffffff;background:transparent;text-shadow:0 1px 2px rgba(0,0,0,.55)}
@media (max-width:760px){.hero-slot h1{font-size:clamp(2rem,10vw,var(--preview-heading-size))}.home-header,.hero-wrap,.generated-sections{padding-left:16px;padding-right:16px}}
  </style>
</head>
<body>
<div class="home-root" style="--preview-bg:#011301;--preview-text:#dbe6e6;--preview-accent:#011313;--preview-muted:#87a69e;--preview-surface:#9e5757;--preview-bg-opacity:1;--preview-button-text:#e0d1d1;--preview-button-size:16px;--preview-heading-size:73px;--preview-body-size:23px;font-family:'Sora','Segoe UI',sans-serif;"><div class="home-bg" style="background-image:url('images/nv-photo.png');background-size:115% 115%;background-position:0% 17%;"></div><div class="home-overlay" style="background:linear-gradient(160deg, color-mix(in srgb, #9e5757 86%, #ffffff 14%) 0%, transparent 70%);"></div><header class="home-header"><div class="brand-logos"><div class="logo-slot" style="width:72px;height:72px;opacity:1;transform:translate(4px,17px) rotate(0deg);"><span class="logo-fallback">VinATech</span></div><div class="logo-slot" style="width:72px;height:72px;opacity:1;transform:translate(92px,12px) rotate(0deg);"><span class="logo-fallback">Logo 2</span></div></div><nav class="home-nav nav-slot" style="transform:translate(4px,-40px);"><a href="index.html" style="color:#0d2b2b;background-color:#9e5757;background-image:none;border-color:#9e5757;font-family:'Sora','Segoe UI',sans-serif;font-size:var(--preview-button-size);background-color:transparent !important;background-image:none !important;border-color:transparent !important;box-shadow:none !important;">HOME</a><a href="news.html" style="color:#102822;background-color:#9e5757;background-image:none;border-color:#9e5757;font-size:var(--preview-button-size);background-color:transparent !important;background-image:none !important;border-color:transparent !important;box-shadow:none !important;">NEWS</a><a href="privacy.html" style="color:#102822;background-color:#39845b;background-image:none;border-color:#39845b;font-size:var(--preview-button-size);background-color:transparent !important;background-image:none !important;border-color:transparent !important;box-shadow:none !important;">PRIVACY POLICY</a><a href="about.html" style="color:#102822;background-color:#9e5757;background-image:none;border-color:#9e5757;font-size:var(--preview-button-size);background-color:transparent !important;background-image:none !important;border-color:transparent !important;box-shadow:none !important;">CONTACT</a></nav></header><main class="hero-wrap"><section class="hero-title-slot"  style="transform:translate(229px,27px);text-align:center;font-family:'Sora','Segoe UI',sans-serif;"><h1 style="color:#f7fcfb;">Intelligence, Scale and Digital Solutions</h1></section><section class="hero-subtitle-slot"  style="transform:translate(234px,19px);text-align:center;font-family:'Manrope','Segoe UI',sans-serif;"><p style="color:#ebefee;">Inspire. Innovate. Ambition.</p></section><div class="cta-slot" style="transform:translate(572px,-289px);"><a href="solutions.html" style="background:#011313;color:#e0d1d1;font-size:var(--preview-button-size);background:transparent;border-color:transparent;box-shadow:none;">Solutions</a><a href="products.html" style="background:#011313;color:#e0d1d1;font-size:var(--preview-button-size);background:transparent;border-color:transparent;box-shadow:none;">Products</a><a href="support.html" style="background:#011313;color:#e0d1d1;font-size:var(--preview-button-size);background:transparent;border-color:transparent;box-shadow:none;">Support</a><a href="about.html" style="background:#011313;color:#e0d1d1;font-size:var(--preview-button-size);background:transparent;border-color:transparent;box-shadow:none;">About</a></div></main><footer class="site-footer-fixed">&copy;VINATECH 2026. All rights reserved.</footer></div>
