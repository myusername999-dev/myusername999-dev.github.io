<style>.under-construction-root{position:relative;min-height:100dvh;height:100%;width:100%;overflow:hidden;background:#000}.under-construction-picture{position:absolute;inset:0;margin:0}.under-construction-picture img{width:100%;height:100%;object-fit:cover;object-position:center;display:block;border:0;box-shadow:none}.under-construction-root::after{content:'';position:absolute;inset:0;background:rgba(0,0,0,.05)}</style><div class="under-construction-root"><picture class="under-construction-picture"><img id="uc-image" src="images/under-construction.png" alt="Products under construction"></picture><script>(function(){var img=document.getElementById('uc-image');if(!img){return;}var desktop='images/under-construction.png';var mobile='images/under-construction.png';function applySource(){var useMobile=window.matchMedia('(max-width: 760px)').matches;var nextSrc=useMobile?mobile:desktop;img.src=nextSrc||desktop;}img.addEventListener('error',function(){if(img.src!==desktop){img.src=desktop;}});applySource();window.addEventListener('resize',applySource);})();</script></div>
